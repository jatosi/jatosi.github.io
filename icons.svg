<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <!-- 搜索 -->
  <symbol id="icon-search" viewBox="0 0 24 24">
    <circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/>
    <line x1="15.3" y1="15.3" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>

  <!-- 耳机（正在播放） -->
  <symbol id="icon-headphones" viewBox="0 0 24 24">
    <path d="M4 13.5v-1.5a8 8 0 0 1 16 0v1.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <rect x="2.5" y="13" width="4.5" height="7" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
    <rect x="17" y="13" width="4.5" height="7" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
  </symbol>

  <!-- 收藏 -->
  <symbol id="icon-heart" viewBox="0 0 24 24">
    <path fill="currentColor" d="M12 21s-6.7-4.35-9.33-8.02C1.02 10.86 1.3 8 3.34 6.34 5.06 4.94 7.5 5.13 9 6.6L12 9.5l3-2.9c1.5-1.47 3.94-1.66 5.66-.26 2.04 1.66 2.32 4.54.67 6.64C18.7 16.65 12 21 12 21z"/>
  </symbol>

  <!-- 加号 / 加入歌单 -->
  <symbol id="icon-plus" viewBox="0 0 24 24">
    <path fill="currentColor" d="M11 4h2v7h7v2h-7v7h-2v-7H4v-2h7z"/>
  </symbol>

  <!-- 下载 -->
  <symbol id="icon-download" viewBox="0 0 24 24">
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>
  </symbol>

  <!-- 上一首 -->
  <symbol id="icon-prev" viewBox="0 0 24 24">
    <path fill="currentColor" d="M6.2 5h2v14h-2z"/>
    <path fill="currentColor" d="M18 5.27v13.46L8.4 12z"/>
  </symbol>

  <!-- 播放 -->
  <symbol id="icon-play" viewBox="0 0 24 24">
    <path fill="currentColor" d="M8 5.14v13.72c0 .8.87 1.29 1.57.87l11-6.86a1 1 0 0 0 0-1.74l-11-6.86A1 1 0 0 0 8 5.14z"/>
  </symbol>

  <!-- 暂停 -->
  <symbol id="icon-pause" viewBox="0 0 24 24">
    <path fill="currentColor" d="M6.8 5h4v14h-4zM13.2 5h4v14h-4z"/>
  </symbol>

  <!-- 下一首 -->
  <symbol id="icon-next" viewBox="0 0 24 24">
    <path fill="currentColor" d="M15.8 5h2v14h-2z"/>
    <path fill="currentColor" d="M6 5.27v13.46L15.6 12z"/>
  </symbol>

  <!-- 音量 -->
  <symbol id="icon-volume" viewBox="0 0 24 24">
    <path fill="currentColor" d="M4 9.5v5h3.6l4.9 3.7V5.8L7.6 9.5H4z"/>
    <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M16 8.7a5 5 0 0 1 0 6.6M18.6 6a8.6 8.6 0 0 1 0 12"/>
  </symbol>

  <!-- 播放列表 -->
  <symbol id="icon-list" viewBox="0 0 24 24">
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M3.5 6h13M3.5 12h13M3.5 18h8"/>
    <circle cx="19.5" cy="18" r="2" fill="none" stroke="currentColor" stroke-width="2"/>
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M19.5 18V8.3l2.3-.6"/>
  </symbol>

  <!-- 导出收藏 -->
  <symbol id="icon-export" viewBox="0 0 24 24">
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 15V3m0 0l-3.5 3.5M12 3l3.5 3.5M4.5 15v3.5a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V15"/>
  </symbol>

  <!-- 导入收藏 -->
  <symbol id="icon-import" viewBox="0 0 24 24">
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M3 7.5l1.8-2.8h5l1.6 2.3H20a1 1 0 0 1 1 1V10H3V7.5z"/>
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M2.3 10h19.4l-1.5 8.1a2 2 0 0 1-2 1.65H5.8a2 2 0 0 1-2-1.65L2.3 10z"/>
  </symbol>

  <!-- 音符（新建歌单弹窗标题） -->
  <symbol id="icon-music-note" viewBox="0 0 24 24">
    <circle cx="8.5" cy="18" r="2.6" fill="currentColor"/>
    <circle cx="18.5" cy="15.5" r="2.6" fill="currentColor"/>
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M11.1 18V5.8L21.1 4v11.5"/>
  </symbol>

  <!-- 键盘（快捷键说明） -->
  <symbol id="icon-keyboard" viewBox="0 0 24 24">
    <rect x="2" y="6" width="20" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
    <path fill="currentColor" d="M4.8 9h2v2h-2zM8.8 9h2v2h-2zM12.8 9h2v2h-2zM16.8 9h2v2h-2zM4.8 13h2v2h-2zM8.8 13h10.4v2H8.8z"/>
  </symbol>

  <!-- 确定 -->
  <symbol id="icon-check" viewBox="0 0 24 24">
    <path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
  </symbol>

  <!-- 关闭 / 取消 / 移除 -->
  <symbol id="icon-close" viewBox="0 0 24 24">
    <path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/>
  </symbol>

  <!-- 列表循环 -->
  <symbol id="icon-repeat" viewBox="0 0 24 24">
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M17 2.5l4 4-4 4M3.5 12v-2a4 4 0 0 1 4-4H21M7 21.5l-4-4 4-4M20.5 12v2a4 4 0 0 1-4 4H3"/>
  </symbol>

  <!-- 单曲循环 -->
  <symbol id="icon-repeat-one" viewBox="0 0 24 24">
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M17 2.5l4 4-4 4M3.5 12v-2a4 4 0 0 1 4-4H21M7 21.5l-4-4 4-4M20.5 12v2a4 4 0 0 1-4 4H3"/>
    <text x="12" y="14.5" font-size="7.5" font-weight="700" text-anchor="middle" fill="currentColor" stroke="none" font-family="sans-serif">1</text>
  </symbol>

  <!-- 随机播放 -->
  <symbol id="icon-shuffle" viewBox="0 0 24 24">
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M2.5 6h3.3l9.4 12H21M2.5 18h3.3l2.6-3.3M15.2 7.3L18.2 6M15.2 6l3-1.3M18.2 18l3 1.3M18.2 18l3-1.3"/>
  </symbol>
</svg>
